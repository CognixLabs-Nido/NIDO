name: RLS suite (remote DB)

# Suites RLS/audit que hablan con la BD Supabase remota compartida. SACADAS del CI de
# cada PR (ci-pr.yml) para no saturar el pool ni quemar minutos: aquí corren aisladas,
# SERIALIZADAS y solo bajo demanda o de madrugada.
#
# - Serialización DENTRO del run: vitest usa `fileParallelism: false` (vitest.config.ts)
#   → los ficheros RLS corren de uno en uno contra el remoto (nunca en paralelo).
# - Serialización ENTRE runs: el bloque `concurrency` (group global + cancel-in-progress
#   false) encola cualquier run solapado → NUNCA hay dos runs tocando la BD a la vez.

# RED DE SEGURIDAD NOCTURNA (F2, 2-oct-2026). Los PRs los gatea rls-local.yml: la misma
# suite contra una BD efímera construida desde el repo (~3 min, en shards). Esta valida el
# REMOTO (lo que de verdad está aplicado allí) y atrapa una migración aplicada a mano
# distinta de su fichero, que la local no puede ver. En F1 corrieron las dos en cada PR
# con el mismo resultado (706/706, PR #287).
#
# DISPARADORES:
#   - schedule (nightly) → cada madrugada.
#   - workflow_dispatch → a mano (GitHub UI / `gh workflow run rls-suite.yml`), p. ej.
#     justo después de aplicar una migración en el remoto.
#   Ya NO corre en pull_request (lo hizo de D-2 a F1).
#
# Notas del modelo actual (decisión de Jose, D-2):
#   (a) Corre contra el REMOTO COMPARTIDO (mismo proyecto Supabase que el piloto). Por eso
#       el `globalSetup` hace un wipe global de `@nido.test` y por eso TODO run va
#       SERIALIZADO bajo el `concurrency.group: rls-suite` (cancel-in-progress: false; ver
#       bloque abajo): nunca dos runs tocando la BD a la vez (se pisarían el wipe). Hoy es
#       seguro porque NO hay datos reales (ANAIA es un piloto sin familias dadas de alta);
#       el wipe no puede destrozar nada real.
#   (b) CAVEAT de GitHub concurrency: solo mantiene 1 run en curso + 1 en cola; un pending
#       intermedio se CANCELA (queda "cancelled", no falla). Sin PRs solo compiten nightly y
#       los lanzamientos a mano, así que en la práctica ya no pasa.
#   (c) PENDIENTE PRE-PRODUCCIÓN: esta suite escribe fixtures `@nido.test` en el remoto
#       COMPARTIDO y su wipe borra por ese patrón. Al entrar datos reales, decidir si sigue
#       corriendo contra él o contra una BD de test dedicada. La validación del esquema DEL
#       PR y el fin del baile de flags ya los resolvió rls-local.yml.
on:
  workflow_dispatch: {} # lanzable a mano (GitHub UI / `gh workflow run rls-suite.yml`).
  schedule:
    # 02:00 UTC = 03:00 CET / 04:00 CEST — madrugada Europe/Madrid, baja actividad.
    - cron: '0 2 * * *'

# Un único run de la suite RLS a la vez (global, no por rama): si llega otro (nightly +
# dispatch manual solapados), se ENCOLA en vez de correr en paralelo. No cancelamos el
# que ya corre (cancel-in-progress: false) para no dejar la BD a medias.
#
# REGLA (no romper): TODO workflow que ejecute el proyecto `rls` (`npm run test:rls` o
# `vitest run --project rls`) CONTRA EL REMOTO COMPARTIDO escribe fixtures allí y DEBE ir
# bajo este mismo bloque `concurrency: { group: rls-suite, cancel-in-progress: false }`.
# ci-main.yml y ci-pr.yml corren solo `--project unit` (sin BD) a propósito, por eso NO se
# les mete en este grupo (serializaría lo que no compite). EXCEPCIÓN: rls-local.yml corre
# `rls` contra una BD efímera propia del runner (no toca el remoto) → fuera del grupo.
#
# RESIDUAL (fuera del alcance de GitHub concurrency): lanzar `npm run test:rls` EN LOCAL
# mientras puede correr el nightly colisiona con él (dos wipes+writes sobre el mismo
# remoto). No lo previene este bloque; evítalo manualmente.
concurrency:
  group: rls-suite
  cancel-in-progress: false

jobs:
  rls:
    name: RLS + audit (serializado, remoto)
    runs-on: ubuntu-latest
    # Corta un cuelgue por saturación del pool en vez de dejarlo hasta el tope de 6h.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Solo el proyecto `rls` (src/test/rls/** + src/test/audit/**) contra el remoto.
      - name: RLS + audit tests
        run: npm run test:rls
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Flags de gated-tests: todas las migraciones están aplicadas en el remoto.
          F5B34_MIGRATION_APPLIED: '1'
          RECORDATORIOS_MIGRATION_APPLIED: '1'
          EVENTOS_MIGRATION_APPLIED: '1'
          AGENDA_MIGRATION_APPLIED: '1'
          F8_MIGRATION_APPLIED: '1'
          F8_RW0_MIGRATION_APPLIED: '1'
          F8_3B_MIGRATION_APPLIED: '1'
          F9_0_MIGRATION_APPLIED: '1'
          F9_5_0_MIGRATION_APPLIED: '1'
          F10_0_MIGRATION_APPLIED: '1'
          F10_2_MIGRATION_APPLIED: '1'
          F10_3_MIGRATION_APPLIED: '1'
          F11_ALTA_P1_MIGRATION_APPLIED: '1'
          F11_ALTA_P2A_MIGRATION_APPLIED: '1'
          F11_ALTA_P2B_MIGRATION_APPLIED: '1'
          F11_ALTA_P3A_MIGRATION_APPLIED: '1'
          F11_ALTA_P3B1_MIGRATION_APPLIED: '1'
          F11_ALTA_P3C_MIGRATION_APPLIED: '1'
          F11_ALTA_P3F2_MIGRATION_APPLIED: '1'
          F11_A6_MIGRATION_APPLIED: '1'
          F11A_CONSENT_MIGRATION_APPLIED: '1'
          F11A_LEASTPRIV_MIGRATION_APPLIED: '1'
          F11A3_IMAGEN_MIGRATION_APPLIED: '1'
          F11A4_OLVIDO_MIGRATION_APPLIED: '1'
          F11A5_EXPORT_MIGRATION_APPLIED: '1'
          F11A6_RETENCION_MIGRATION_APPLIED: '1'
          F11_F3_MIGRATION_APPLIED: '1'
          F8_FIRMAR_PERMISO_MIGRATION_APPLIED: '1'
          F11_H0_MIGRATION_APPLIED: '1'
          F12B_RLS_APPLIED: '1'
          F12B_5_RLS_APPLIED: '1'
          F12B_6_RLS_APPLIED: '1'
          F3D_MIGRATION_APPLIED: '1'
          F3F_MIGRATION_APPLIED: '1'
          F2B41_MIGRATION_APPLIED: '1'
          F40_MIGRATION_APPLIED: '1'
          F2C1_MIGRATION_APPLIED: '1'
          F2C2_MIGRATION_APPLIED: '1'
          F2C4_MIGRATION_APPLIED: '1'
          F41_MIGRATION_APPLIED: '1'
          F42_MIGRATION_APPLIED: '1'
          F43_MIGRATION_APPLIED: '1'
          F45_MIGRATION_APPLIED: '1'
          D5_MIGRATION_APPLIED: '1'
          B1_TARIFA_ANIO_APPLIED: '1'
          B1_MOTOR_TARIFA_ANIO_APPLIED: '1'
          BECA_COMEDOR_V2_APPLIED: '1'
          BECA_COMEDOR_V2_MOTOR_APPLIED: '1'
          R2_MIGRATION_APPLIED: '1'
          # Descomentar EN CUANTO Jose aplique 20260828120000_phase_recibos_r5_desconfirmar.
          # Hasta entonces `r5-desconfirmar-recibo.rls.test.ts` se salta (el flag se lee con
          # === '1'), porque sin la migración no existen ni desconfirmar_recibo ni
          # recibo_en_remesa y la suite entera saldría roja.
          R5_MIGRATION_APPLIED: '1'
          # Descomentar EN CUANTO Jose aplique
          # 20260829120000_phase_beca_b2_3_desborde_resuelto_cerrado. Hasta entonces
          # `b23-desborde-resuelto-cerrado.rls.test.ts` se salta: sin la migración el motor
          # sigue borrando los desbordes resueltos y los 3 casos saldrían rojos.
          B23_MIGRATION_APPLIED: '1'
          # Se activa cuando Jose aplique `20260830120000_phase_matriculas_activada_at`.
          ALUMNOS_ACTIVADA_AT_MIGRATION_APPLIED: '1'
          # Migraciones aplicadas hace tiempo cuyos flags nunca se encendieron aquí: sus
          # ficheros se saltaban en CI desde jun-jul. Verificados uno a uno contra el remoto
          # (1-oct-2026): los 9 pasan.
          F3A_MIGRATION_APPLIED: '1'
          F3C1_MIGRATION_APPLIED: '1'
          F3C2_MIGRATION_APPLIED: '1'
          F3C3_MIGRATION_APPLIED: '1'
          F11C0_MIGRATION_APPLIED: '1'
          F11G_RLS_APPLIED: '1'
          IMAGEN_CONSENT_DERIVADO_APPLIED: '1'
          IMAGEN_IU3_APPLIED: '1'
          # Descomentar EN CUANTO Jose aplique 20261001120000_fix_audit_log_revoke_anon_authenticated.
          # Hasta entonces audit-log.rls.test.ts exige el comportamiento RLS (0 filas, sin
          # error); con el flag exige 42501 en UPDATE/DELETE del admin.
          AUDIT_LOG_REVOKE_APPLIED: '1'
          # Descomentar EN CUANTO Jose aplique 20261001130000_fix_consent_imagen_rpc_seguridad.
          # Hasta entonces consent-imagen-rpc-seguridad.rls.test.ts se salta: sin la migración
          # anon todavía puede llamar a las RPCs y un tutor puede atribuir el consentimiento a
          # otro usuario, así que los casos saldrían rojos.
          CONSENT_IMAGEN_RPC_SEGURIDAD_APPLIED: '1'
          # Descomentar EN CUANTO Jose aplique 20261002120000_fix_consent_imagen_solo_tutor_legal.
          # Hasta entonces consent-imagen-tutor-legal.rls.test.ts se salta: sin la migración el
          # vínculo «autorizado» todavía puede otorgar/revocar por las RPCs y su firma genera
          # consentimiento, así que los casos saldrían rojos.
          CONSENT_IMAGEN_TUTOR_LEGAL_APPLIED: '1'
          # 20261002130000_fix_alta_hermano_vincular_tutores (#291), aplicada: el hermano queda
          # vinculado a todos los tutores de la familia (alta-hermano-tutores.rls.test.ts).
          ALTA_HERMANO_TUTORES_APPLIED: '1'
