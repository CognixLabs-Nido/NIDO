name: CI — Pull Request

on:
  pull_request:
    branches: [main]

# Cancela runs anteriores del mismo PR al pushear un commit nuevo (ahorra minutos).
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Censo C (decisión de Jose del 2026-11-25): el escáner de cadena, en un job PROPIO y en paralelo
  # con `checks` y los shards de `rls-local.yml` (sin `needs`): «Si añade hasta 25 minutos a cada PR
  # encima de los que ya tarda, lo vamos a acabar odiando y alguien lo quitará». Pone la CI roja si
  # una acción o una ruta informa como fallido algo que ya guardó (fuera de su lista, que solo encoge),
  # o si una acción deja escapar una LecturaFallida. Sin BD: la volatilidad de cada RPC sale de las
  # migraciones.
  cadena:
    name: Cadena — se guardó y te digo que no
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Escáner de cadena
        run: npm run check:cadena-tras-escritura

  # Censo C (2026-11-26): el fallo que se pierde entre un helper y quien lo llama (el helper devuelve el
  # constructor de la consulta, o avisa con null/una bandera, y el llamador no lo mira). Rojo si aparece uno
  # nuevo fuera de `scripts/ci/fallo-que-se-pierde.lista.json`, o si sobra uno en la lista (solo encoge).
  fallo-que-se-pierde:
    name: Fallo que se pierde — el aviso que nadie mira
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Escáner del fallo que se pierde
        run: npm run check:fallo-que-se-pierde

  # Nombre de job SIN cambiar ("Typecheck, Lint, Test") para no romper el required
  # status check de la protección de rama. Solo corre lo RÁPIDO y sin BD: typecheck,
  # lint, format, UNIT (proyecto vitest `unit`, excluye RLS/audit) y build. Las suites
  # RLS/audit necesitan BD: corren en `rls-local.yml`, contra una BD efímera del runner, en
  # cada PR, y sobre main cada madrugada desde `nocturna.yml`.
  checks:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Multicentro: lo que queda por migrar al contexto de centro (y rojo si algo sube). El mismo
      # guard corre dentro de los unit tests; este paso lo deja impreso en el log y el resumen.
      - name: Guard centro activo
        run: npm run check:centro-activo

      # Multicentro: toda lectura de una tabla de centro filtra por su centro, o dice por qué no
      # (`// entre-centros: <motivo>`). La RLS dice quién ve la fila, no de qué centro es la página.
      - name: Guard lecturas por centro
        run: npm run check:lecturas-por-centro

      # Solo el proyecto `unit` (excluye src/test/rls/** y src/test/audit/**): sin red,
      # sin credenciales del remoto. Los tests RLS/audit corren en `rls-local.yml`.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
