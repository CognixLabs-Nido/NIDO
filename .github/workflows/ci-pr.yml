name: CI — Pull Request

on:
  pull_request:
    branches: [main]

# Cancela runs anteriores del mismo PR al pushear un commit nuevo (ahorra minutos).
concurrency:
  group: ci-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nombre de job SIN cambiar ("Typecheck, Lint, Test") para no romper el required
  # status check de la protección de rama. Solo corre lo RÁPIDO y sin BD: typecheck,
  # lint, format, UNIT (proyecto vitest `unit`, excluye RLS/audit) y build. Las suites
  # RLS/audit necesitan BD: corren en `rls-local.yml`, contra una BD efímera del runner, en
  # cada PR, y sobre main cada madrugada desde `nocturna.yml`.
  checks:
    name: Typecheck, Lint, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Multicentro: lo que queda por migrar al contexto de centro (y rojo si algo sube). El mismo
      # guard corre dentro de los unit tests; este paso lo deja impreso en el log y el resumen.
      - name: Guard centro activo
        run: npm run check:centro-activo

      # Multicentro: toda lectura de una tabla de centro filtra por su centro, o dice por qué no
      # (`// entre-centros: <motivo>`). La RLS dice quién ve la fila, no de qué centro es la página.
      - name: Guard lecturas por centro
        run: npm run check:lecturas-por-centro

      # Solo el proyecto `unit` (excluye src/test/rls/** y src/test/audit/**): sin red,
      # sin credenciales del remoto. Los tests RLS/audit corren en `rls-local.yml`.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
