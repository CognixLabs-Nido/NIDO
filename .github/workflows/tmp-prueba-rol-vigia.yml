name: TEMPORAL prueba rol vigia_catalogo

# ⚠️ TEMPORAL (PR #341). Prueba en vivo del rol vigia_catalogo con la cadena real del secret
# PROD_CATALOGO_DB_URL. Se QUITA del PR antes de mergear: nunca llega a main.
#
# El repo y este log son PÚBLICOS. El job solo imprime:
#   - login OK/fallo y si la 4.ª conexión simultánea se rechaza;
#   - de las 3 funciones de vigia, un recuento de filas (ningún nombre ni versión);
#   - el error literal de cada SELECT y de cada INSERT;
#   - el valor de default_transaction_read_only.
# Nunca imprime la cadena de conexión (y GitHub la enmascararía si apareciera).

on:
  push:
    branches: [feat/rol-vigia-catalogo]
    paths: [.github/workflows/tmp-prueba-rol-vigia.yml]

permissions:
  contents: read

jobs:
  prueba:
    name: Prueba en vivo del rol vigia_catalogo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cliente psql
        run: command -v psql >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Intentos con el rol real
        env:
          URL: ${{ secrets.PROD_CATALOGO_DB_URL }}
          PGCONNECT_TIMEOUT: '15'
        run: |
          set -u
          [ -n "$URL" ] || { echo "El secret PROD_CATALOGO_DB_URL está vacío"; exit 1; }
          fallos=()
          q() { psql "$URL" -X -tA -v ON_ERROR_STOP=1 -c "$1" 2>&1; }

          echo "== 1. Login"
          if r=$(q "SELECT current_user"); then
            echo "login OK como: $r"
            [ "$r" = vigia_catalogo ] || fallos+=("current_user no es vigia_catalogo")
          else
            echo "login FALLO: $r"; exit 1
          fi

          echo "== 2. default_transaction_read_only"
          r=$(q "SHOW default_transaction_read_only"); echo "default_transaction_read_only = $r"
          [ "$r" = on ] || fallos+=("default_transaction_read_only no es on")

          echo "== 3. Funciones de vigia (solo recuento)"
          for fn in migraciones buckets secretos_vault; do
            if r=$(q "SELECT count(*) FROM vigia.$fn()"); then
              echo "vigia.$fn(): responde / $r filas"
              [ "$r" -gt 0 ] || fallos+=("vigia.$fn() devuelve 0 filas")
            else
              echo "vigia.$fn(): FALLO: $r"; fallos+=("vigia.$fn() no responde")
            fi
          done

          echo "== 4. SELECT sobre datos de negocio (deben fallar)"
          for t in public.ninos public.usuarios public.audit_log storage.objects; do
            if r=$(q "SELECT count(*) FROM $t"); then
              echo "SELECT $t: NO FALLÓ (devolvió un recuento)"; fallos+=("SELECT $t no falló")
            else
              echo "SELECT $t: $r"
              case "$r" in *"permission denied"*) ;; *) fallos+=("SELECT $t falló sin permiso denegado");; esac
            fi
          done

          echo "== 5. INSERT (debe fallar)"
          if r=$(q "INSERT INTO public.centros DEFAULT VALUES"); then
            echo "INSERT (transacción por defecto): NO FALLÓ"; fallos+=("INSERT no falló")
          else
            echo "INSERT (transacción por defecto): $r"
            case "$r" in *"read-only transaction"*) ;; *) fallos+=("el INSERT no abortó por read-only");; esac
          fi
          # Segunda capa: con la transacción en lectura-escritura a mano, debe fallar por permisos.
          if r=$(q "BEGIN READ WRITE; INSERT INTO public.centros DEFAULT VALUES; ROLLBACK;"); then
            echo "INSERT (BEGIN READ WRITE): NO FALLÓ"; fallos+=("INSERT READ WRITE no falló")
          else
            echo "INSERT (BEGIN READ WRITE): $r"
            case "$r" in *"permission denied"*) ;; *) fallos+=("el INSERT READ WRITE falló sin permiso denegado");; esac
          fi

          echo "== 6. Límite de 3 conexiones"
          for i in 1 2 3; do
            psql "$URL" -X -tA -c "SELECT pg_sleep(25)" >/tmp/sesion$i.txt 2>&1 &
          done
          sleep 8
          if r=$(q "SELECT 1"); then
            echo "4.ª conexión simultánea: ACEPTADA"; fallos+=("la 4.ª conexión no se rechazó")
          else
            echo "4.ª conexión simultánea: rechazada: $r"
          fi
          wait
          for i in 1 2 3; do
            if grep -qiE 'error|fatal' /tmp/sesion$i.txt; then
              echo "sesión $i de las 3: $(cat /tmp/sesion$i.txt)"; fallos+=("la sesión $i de las 3 no entró")
            else
              echo "sesión $i de las 3: OK"
            fi
          done

          echo "== Resultado"
          if [ ${#fallos[@]} -gt 0 ]; then printf -- '- %s\n' "${fallos[@]}"; exit 1; fi
          echo "Todo como se esperaba."
